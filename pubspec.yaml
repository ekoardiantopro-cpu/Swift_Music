name: swift_music
description: Cross-platform music player with background playback.
publish_to: none
version: 1.4.1+7
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_bloc: ^9.1.1
  cached_network_image: ^4.0.5
  salomon_bottom_bar: ^3.3.2
  shared_preferences: ^2.5.6
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.8
  package_info_plus: ^10.2.2
  xml: ^6.6.1
  youtube_player_iframe: ^6.0.2
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  http: ^1.5.0
  video_player: ^2.14.1
  in_app_webview_flutter: 1.1.0
  connectivity_plus: 7.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/swift_music_icon.png
