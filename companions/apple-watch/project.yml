name: SwiftMusicWatch
options:
  bundleIdPrefix: com.swiftmusic
targets:
  SwiftMusicWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - SwiftMusicWatchApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftmusic.swiftMusic.watchkitapp
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Swift Music
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.swiftmusic.swiftMusic
        MARKETING_VERSION: '1.3.0'
        CURRENT_PROJECT_VERSION: 5
        TARGETED_DEVICE_FAMILY: 4
