flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/swift_music_icon.png
  min_sdk_android: 24
  adaptive_icon_background: '#2ADE74'
  adaptive_icon_foreground: assets/branding/swift_music_icon.png
  # 108dp layer -> safe 66dp center; match the visual scale of the iOS icon.
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: '#2ADE74'
